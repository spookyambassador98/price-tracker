services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: price_tracker
      POSTGRES_PASSWORD: price_tracker
      POSTGRES_DB: price_tracker
    ports:
      - "5432:5432"
    volumes:
      - price_tracker_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U price_tracker"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  price_tracker_pgdata:
